name: Update KTC values

on:
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Pull today's KeepTradeCut values
        run: node update-ktc.mjs
      - name: Save if anything changed
        run: |
          if git diff --quiet -- ktc.js; then
            echo "No changes today."
            exit 0
          fi
          git config user.name "ktc-bot"
          git config user.email "ktc-bot@users.noreply.github.com"
          git add ktc.js
          git commit -m "Update KTC values $(date -u +%Y-%m-%d)"
          git push
